<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM de Obras Enerwatt — Projeto Âncora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07090f;
    --panel:#10131b;
    --panel-2:#151924;
    --border:#232838;
    --border-soft:#1a1e2b;
    --text:#eef0f5;
    --text-dim:#9aa0b4;
    --text-faint:#5c6178;
    --accent:#e8722a;
    --accent-dim:#e8722a33;
    --red:#e5484d;
    --red-bg:#e5484d1a;
    --yellow:#e0a940;
    --yellow-bg:#e0a9401a;
    --green:#2fae63;
    --green-bg:#2fae631a;
    --blue:#4f8ff0;
    --blue-bg:#4f8ff01a;
    --radius:12px;
    --radius-sm:8px;
    --font-ui:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, #e8722a0d, transparent),
      radial-gradient(ellipse 700px 500px at 100% 10%, #e8722a08, transparent);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    font-size:14px;
    line-height:1.5;
  }
  .hero-banner{
    position:relative;height:150px;border-radius:var(--radius);overflow:hidden;
    margin-bottom:20px;border:1px solid var(--border-soft);
  }
  .hero-banner svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .hero-overlay{position:absolute;left:22px;bottom:16px;z-index:2;}
  .hero-title{font-size:19px;font-weight:800;letter-spacing:.01em;color:#fff;text-shadow:0 2px 12px #000000a0;}
  .hero-sub{font-size:11.5px;color:#d8dae4;margin-top:2px;font-family:var(--font-mono);text-shadow:0 1px 8px #000000a0;}
  #app{display:flex;min-height:100vh;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:230px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--border-soft);
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    padding:18px 20px 18px;
    border-bottom:1px solid var(--border-soft);
  }
  .brand-logo{
    background:#ffffff;border-radius:8px;padding:10px 12px;margin-bottom:12px;
    display:flex;align-items:center;justify-content:flex-start;
  }
  .brand-logo img{height:26px;width:auto;display:block;}
  .brand-title{font-size:14px;font-weight:800;letter-spacing:.02em;color:var(--text);}
  .brand-sub{font-size:11px;color:var(--text-faint);margin-top:3px;font-family:var(--font-mono);letter-spacing:.02em;}
  .nav{padding:14px 10px;flex:1;overflow-y:auto;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;border-radius:var(--radius-sm);
    color:var(--text-dim);font-size:13px;font-weight:500;
    cursor:pointer;margin-bottom:2px;transition:background .12s,color .12s;
    border:1px solid transparent;
    user-select:none;
  }
  .nav-item:hover{background:var(--panel-2);color:var(--text);}
  .nav-item.active{background:var(--accent-dim);color:var(--accent);border-color:#e8722a40;font-weight:600;}
  .nav-icon{width:16px;text-align:center;font-size:14px;opacity:.9;}
  .nav-badge{
    margin-left:auto;font-family:var(--font-mono);font-size:10px;
    background:var(--panel-2);color:var(--text-faint);padding:1px 6px;border-radius:20px;
  }
  .nav-item.active .nav-badge{background:#e8722a2e;color:var(--accent);}
  .sidebar-foot{border-top:1px solid var(--border-soft);}
  .lock-row{
    display:flex;align-items:center;gap:8px;padding:13px 20px;
    font-size:11px;color:var(--text-faint);cursor:pointer;transition:background .12s,color .12s;
  }
  .lock-row:hover{background:var(--panel-2);color:var(--text-dim);}

  /* ---------- MOBILE TOPBAR / DRAWER (hidden on desktop) ---------- */
  .mobile-topbar{
    display:none;align-items:center;gap:12px;
    position:sticky;top:0;z-index:30;
    background:var(--panel);border-bottom:1px solid var(--border-soft);
    padding:0 12px;height:52px;flex-shrink:0;
  }
  .hamburger{
    background:none;border:none;color:var(--text);font-size:20px;line-height:1;
    padding:6px 8px;cursor:pointer;border-radius:8px;
  }
  .hamburger:active{background:var(--panel-2);}
  .mobile-topbar-title{font-size:13px;font-weight:700;letter-spacing:.02em;}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:#000000a0;z-index:39;}

  @media (max-width:860px){
    #app{flex-direction:column;}
    .mobile-topbar{display:flex;}
    .sidebar{
      position:fixed;top:0;left:0;height:100dvh;width:78%;max-width:290px;
      z-index:40;transform:translateX(-100%);transition:transform .22s ease;
      box-shadow:0 0 40px #000000a0;
    }
    .sidebar.open{transform:translateX(0);}
    .sidebar-backdrop.show{display:block;}
    .main{padding:16px 14px 50px;max-width:100%;}
    .grid-4, .grid-3{grid-template-columns:1fr 1fr;}
    .grid-2{grid-template-columns:1fr;}
    .page-title{font-size:18px;}
    .hero-banner{height:110px;}
    .hero-title{font-size:15px;}
    .hero-sub{font-size:10px;}
    .form-grid{grid-template-columns:1fr;}
    .modal-overlay{padding:10px;}
    .modal{max-width:100%;margin:0;max-height:92vh;}
    th, td{padding:8px 9px;font-size:12px;}
    .panel{padding:14px 14px;}
    .search-box{min-width:0;flex:1;}
  }
  @media (max-width:480px){
    .grid-4, .grid-3{grid-template-columns:1fr;}
    .kpi-value{font-size:22px;}
  }

  /* ---------- MAIN ---------- */
  .main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1400px;}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .page-title{font-size:21px;font-weight:800;letter-spacing:-.01em;}
  .page-sub{font-size:12.5px;color:var(--text-faint);margin-top:3px;}
  .topbar-actions{display:flex;gap:8px;}

  /* ---------- BUTTONS ---------- */
  .btn{
    font-family:var(--font-ui);font-size:12.5px;font-weight:600;
    padding:8px 14px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:all .12s;
    white-space:nowrap;
  }
  .btn:hover{border-color:#333a4f;background:#1a1f2c;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#1a0d02;font-weight:700;}
  .btn-primary:hover{background:#f2822f;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
  .btn-ghost:hover{background:var(--panel-2);color:var(--text);}
  .btn-danger{color:var(--red);}
  .btn-sm{padding:5px 10px;font-size:11.5px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---------- CARDS / KPI ---------- */
  .grid{display:grid;gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

  .kpi{
    background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);
    padding:16px 18px;position:relative;overflow:hidden;
  }
  .kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--kpi-color,var(--accent));}
  .kpi-label{font-size:11px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .kpi-value{font-size:26px;font-weight:800;margin-top:6px;font-family:var(--font-mono);}
  .kpi-foot{font-size:11px;color:var(--text-dim);margin-top:4px;}

  .panel{
    background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:18px;
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .panel-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .panel-title .cnt{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);font-weight:500;}

  /* ---------- CHIPS / BADGES ---------- */
  .chip{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;
    white-space:nowrap;font-family:var(--font-ui);
  }
  .chip-red{background:var(--red-bg);color:var(--red);}
  .chip-yellow{background:var(--yellow-bg);color:var(--yellow);}
  .chip-green{background:var(--green-bg);color:var(--green);}
  .chip-blue{background:var(--blue-bg);color:var(--blue);}
  .chip-gray{background:#ffffff0f;color:var(--text-dim);}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}

  /* ---------- TABLE ---------- */
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--text-faint);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--border-soft);
    white-space:nowrap;
  }
  td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;color:var(--text);white-space:nowrap;}
  tbody tr{transition:background .1s;}
  tbody tr:hover{background:var(--panel-2);}
  .mono{font-family:var(--font-mono);}
  .text-dim{color:var(--text-dim);}
  .text-faint{color:var(--text-faint);}
  .row-actions{display:flex;gap:4px;}
  .empty-state{padding:40px 20px;text-align:center;color:var(--text-faint);}
  .empty-state .big{font-size:28px;margin-bottom:8px;}

  /* ---------- SEARCH / FILTER ---------- */
  .search-box{
    display:flex;align-items:center;gap:8px;background:var(--panel-2);
    border:1px solid var(--border);border-radius:8px;padding:7px 12px;min-width:220px;
  }
  .search-box input{background:none;border:none;outline:none;color:var(--text);font-size:12.5px;width:100%;font-family:var(--font-ui);}
  .search-box input::placeholder{color:var(--text-faint);}
  select.filter-select{
    background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-size:12.5px;padding:7px 10px;font-family:var(--font-ui);cursor:pointer;
  }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:#000000b3;backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
    box-shadow:0 20px 60px #000000a0;
  }
  .modal-head{
    padding:18px 22px;border-bottom:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--panel);z-index:2;
  }
  .modal-title{font-size:15px;font-weight:700;}
  .modal-close{cursor:pointer;color:var(--text-faint);font-size:18px;line-height:1;padding:4px;}
  .modal-close:hover{color:var(--text);}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border-soft);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--panel);}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid.single{grid-template-columns:1fr;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.span2{grid-column:1/-1;}
  .field label{font-size:11.5px;font-weight:600;color:var(--text-dim);}
  .field .hint{font-size:10.5px;color:var(--text-faint);}
  .field input, .field select, .field textarea{
    background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    padding:9px 11px;color:var(--text);font-size:13px;font-family:var(--font-ui);outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:60px;}
  .section-divider{
    grid-column:1/-1;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    color:var(--accent);margin-top:6px;padding-top:14px;border-top:1px solid var(--border-soft);
  }

  /* ---------- TOAST ---------- */
  #toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{
    background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
    padding:11px 16px;font-size:12.5px;font-weight:600;box-shadow:0 8px 24px #00000060;
    display:flex;align-items:center;gap:8px;animation:toast-in .18s ease-out;
  }
  .toast.ok{border-color:#2fae6355;color:var(--green);}
  .toast.err{border-color:#e5484d55;color:var(--red);}
  @keyframes toast-in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- MISC ---------- */
  .bar-track{width:100%;height:6px;background:var(--panel-2);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;}
  .loading-screen{
    position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;z-index:999;
  }
  .spinner{
    width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{font-size:12.5px;color:var(--text-faint);font-family:var(--font-mono);}

  .avatar-list{display:flex;flex-wrap:wrap;gap:5px;}
  .avatar-tag{
    font-family:var(--font-mono);font-size:10.5px;background:var(--panel-2);
    border:1px solid var(--border);border-radius:6px;padding:3px 7px;color:var(--text-dim);
    display:flex;align-items:center;gap:5px;
  }
  .avatar-tag .rm{cursor:pointer;color:var(--text-faint);}
  .avatar-tag .rm:hover{color:var(--red);}
  .add-inline{display:flex;gap:6px;margin-top:8px;}
  .add-inline input{flex:1;}

  .link-btn{background:none;border:none;color:var(--accent);font-size:11.5px;font-weight:600;cursor:pointer;padding:0;}
  .subtle-card{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#252a3a;border-radius:6px;}
  ::-webkit-scrollbar-thumb:hover{background:#2f3547;}
</style>
</head>

function parseDate(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); if(!y) return null; const dt=new Date(y,m-1,d); dt.setHours(0,0,0,0); return dt; }
function toISO(d){ if(!d) return ''; const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function fmtDate(d){ if(!d) return '—'; if(typeof d === 'string') d = parseDate(d); if(!d) return '—'; const dd=String(d.getDate()).padStart(2,'0'),mm=String(d.getMonth()+1).padStart(2,'0'),yy=d.getFullYear(); return `${dd}/${mm}/${yy}`; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function addMonths(d,n){ const r=new Date(d); r.setMonth(r.getMonth()+n); return r; }
function diffDays(a,b){ return Math.round((a-b)/86400000); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function applyLoaded(key, val){
  switch(key){
    case K.EFETIVO: STATE.efetivo = val || []; break;
    case K.FOLGA: STATE.folga = val || []; break;
    case K.PASSAGENS: STATE.passagens = val || []; break;

    case K.PARAMETROS: STATE.params = val ? {...DEFAULT_PARAMS, ...val} : {...DEFAULT_PARAMS}; break;
  }
}
async function persist(key, value){
  try{
    if(!window.storage) throw new Error('sem storage');
    const r = await window.storage.set(key, JSON.stringify(value), true); // shared = todo mundo com o link vê os mesmos dados
    if(!r) throw new Error('sem resposta do storage');
    return true;
  }catch(e){
    toast('Não consegui salvar — este site publicado não tem conexão com o armazenamento (fora do Claude). As edições ficam só nesta aba até a página ser recarregada.', 'err');

}

/* ============================================================
   MOTOR DE CICLOS — FOLGA DE CAMPO
   Gera automaticamente o ciclo seguinte assim que o anterior é
   concluído. Não existe limite de ciclos (3, 6, ou o que for).
   ============================================================ */
function getFolgaRecord(chapa){ return STATE.folga.find(f=>f.chapa===chapa); }
function cicloDuracao(tipo){ return tipo==='B' ? {ciclo:STATE.params.cicloB, folga:STATE.params.folgaB} : {ciclo:STATE.params.cicloA, folga:STATE.params.folgaA}; }

function getActiveCycle(emp){
  const rec = getFolgaRecord(emp.chapa);
  const {ciclo:diasCiclo, folga:diasFolga} = cicloDuracao(emp.tipo);
  const ciclos = (rec && rec.ciclos) || [];
  const base = parseDate(emp.dtInicioObra);
  if(!base) return {numero:1, sp:null, sr:null, rp:null, rr:null, virtual:true};

  if(ciclos.length===0){
    return {numero:1, sp:addDays(base,diasCiclo), sr:null, rp:null, rr:null, virtual:true};
  }
  const last = ciclos[ciclos.length-1];
  const lastRR = last.retornoReal ? parseDate(last.retornoReal) : null;
  if(lastRR && TODAY>=lastRR){
    return {numero:ciclos.length+1, sp:addDays(lastRR,diasCiclo), sr:null, rp:null, rr:null, virtual:true};
  }
  const sr = last.saidaReal ? parseDate(last.saidaReal) : null;
  return {
    numero: ciclos.length,
    sp: last.saidaPrevista ? parseDate(last.saidaPrevista) : null,
    sr: sr,
    rp: sr ? addDays(sr, diasFolga) : null,
    rr: last.retornoReal ? parseDate(last.retornoReal) : null,
    virtual:false, index:ciclos.length-1
  };
}

function computeFolgaStatus(cycle){
  const {sp,sr,rp,rr} = cycle;
  if(sr && TODAY>=sr){
    if(rr && TODAY>=rr) return 'CONCLUIDA';
    if(!rr && rp && TODAY>rp) return 'RETORNO_ATRASADO';
    return 'EM_FOLGA';
  }
  if(sr && TODAY<sr) return 'SAIDA_AGENDADA';
  if(sp && TODAY>sp) return 'FOLGA_ATRASADA';
  if(sp && diffDays(sp,TODAY)<=STATE.params.alertaFolgaVermelho) return 'FOLGA_URGENTE';
  if(sp && diffDays(sp,TODAY)<=STATE.params.alertaFolgaAmarelo) return 'FOLGA_PROXIMA';
  return 'EM_DIA';
}

function computePassagemStatus(cycle, manual){
  if(cycle.sr) return {level:'green', label:'Emitida (já registrada na folga)'};
  if(manual.status==='EMITIDA') return {level:'green', label:'Emitida'};
  if(manual.status==='SOLICITADA') return {level:'green', label:'Solicitada'};
  if(!cycle.sp) return {level:'gray', label:'Sem previsão'};
  const dias = diffDays(cycle.sp, TODAY);
  if(dias<=STATE.params.alertaCritico) return {level:'red', label: dias<0 ? `Atrasada ${Math.abs(dias)}d` : 'Urgente'};

  return {level:'green', label:'No prazo'};

   MOTOR DE CICLOS — FÉRIAS (mesmo princípio da folga)
   ============================================================ */
function getFeriasRecord(chapa){ return STATE.ferias.find(f=>f.chapa===chapa); }

function getActivePeriodo(emp){
  const rec = getFeriasRecord(emp.chapa);
  const periodos = (rec && rec.periodos) || [];
  const admissao = parseDate(emp.dtAdmissao);
  if(!admissao) return {numero:1, fimPeriodo:null, dataLimite:null, gozoInicio:null, gozoFim:null, virtual:true};

  if(periodos.length===0){
    const fimPeriodo = addMonths(admissao,12);
    const dataLimite = addMonths(fimPeriodo,11);
    return {numero:1, fimPeriodo, dataLimite, gozoInicio:null, gozoFim:null, virtual:true};
  }
  const last = periodos[periodos.length-1];
  const lastGF = last.gozoFim ? parseDate(last.gozoFim) : null;
  if(lastGF && TODAY>=lastGF){
    const fimPeriodo = addMonths(parseDate(last.fimPeriodo),12);
    const dataLimite = addMonths(fimPeriodo,11);
    return {numero:periodos.length+1, fimPeriodo, dataLimite, gozoInicio:null, gozoFim:null, virtual:true};
  }
  return {
    numero:periodos.length,
    fimPeriodo: parseDate(last.fimPeriodo), dataLimite: parseDate(last.dataLimite),
    gozoInicio: last.gozoInicio?parseDate(last.gozoInicio):null, gozoFim: last.gozoFim?parseDate(last.gozoFim):null,
    virtual:false, index:periodos.length-1
  };
}

function computeFeriasStatus(periodo){
  const {dataLimite, gozoInicio, gozoFim} = periodo;
  if(gozoFim && TODAY>=gozoFim) return 'CONCLUIDA';
  if(gozoInicio && TODAY>=gozoInicio && (!gozoFim || TODAY<gozoFim)) return 'EM_GOZO';
  if(gozoInicio && TODAY<gozoInicio) return 'GOZO_AGENDADO';
  if(!dataLimite) return 'EM_DIA';
  const dias = diffDays(dataLimite, TODAY);
  if(dias<0) return 'VENCIDA';
  if(dias<=STATE.params.alertaFeriasUrgente) return 'URGENTE';
  if(dias<=STATE.params.alertaFeriasVencendo) return 'VENCENDO';
  return 'EM_DIA';
}

  const p = STATE.params;

function statusBarList(items, total){
  return items.map(([label,count,color])=>{
    const pct = total? Math.round(count/total*100) : 0;
    return `<div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;">
        <span class="text-dim">${esc(label)}</span><span class="mono">${count}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--${color})"></div></div>
    </div>`;
  }).join('');
}
function fmtMoney(n){ return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function salarioAtual(s){ const base=Number(s.salarioBase)||0; const ajustes=s.ajustes||[]; const last=ajustes[ajustes.length-1]; const pct=last? Number(last.percentual)||0 : 0; return base*(1+pct/100); }

}
function maskCpf(el){
  let v = el.value.replace(/\D/g,'').slice(0,11);
  v = v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  el.value = v;
}
function calcIdade(dtNascimento){
  const bd = parseDate(dtNascimento);
  if(!bd) return null;
  let idade = TODAY.getFullYear() - bd.getFullYear();
  const beforeBday = (TODAY.getMonth()<bd.getMonth()) || (TODAY.getMonth()===bd.getMonth() && TODAY.getDate()<bd.getDate());
  if(beforeBday) idade--;
  return idade;
}
function updateIdadePreview(){
  const v = document.getElementById('f_nascimento').value;
  const el = document.getElementById('idadePreview');
  if(!el) return;
  el.textContent = v ? `${calcIdade(v)} anos` : '';
}

function submitEfetivo(originalChapa){
  if(!requireEdit()) return;
  const chapa = val('f_chapa'), nome = val('f_nome');
  if(!chapa || !nome){ toast('Preencha chapa e nome.','err'); return; }
  const cpf = val('f_cpf');
  if(cpf && cpf.replace(/\D/g,'').length !== 11){ toast('CPF incompleto — precisa ter 11 números.','err'); return; }
  const record = {
    chapa, nome, cpf: cpf || null, dtNascimento: val('f_nascimento') || null,
    funcao: val('f_funcao'), tipo: val('f_tipo'),
    dtAdmissao: val('f_admissao'), dtInicioObra: val('f_inicioObra') || val('f_admissao'),
    dtDesligamento: val('f_desligamento') || null
  };
  if(originalChapa){
    const idx = STATE.efetivo.findIndex(e=>String(e.chapa)===String(originalChapa));
    if(idx>-1) STATE.efetivo[idx] = record;
    if(originalChapa !== chapa){
      [STATE.folga, STATE.passagens, STATE.ferias, STATE.salarial].forEach(arr=>{
        const r = arr.find(x=>String(x.chapa)===String(originalChapa)); if(r) r.chapa = chapa;
      });
    }
  } else {
    if(STATE.efetivo.some(e=>String(e.chapa)===String(chapa))){ toast('Já existe um colaborador com essa chapa.','err'); return; }
    STATE.efetivo.push(record);
  }
  closeModal();
  saveEfetivo();
}
function deleteEfetivo(chapa){
  if(!requireEdit()) return;
  if(!confirm('Excluir este colaborador? Isso não apaga o histórico de folga/férias/salário associado.')) return;
  STATE.efetivo = STATE.efetivo.filter(e=>String(e.chapa)!==String(chapa));
  saveEfetivo();
}

  window.__tmpMoradores = moradores;
  const body = `<div class="form-grid">
    ${field('Nome do alojamento *', inp('f_al_nome','text', editing?editing.nome:''))}
    ${field('Capacidade (vagas) *', inp('f_al_cap','number', editing?editing.capacidade:''))}
    ${field('Endereço', inp('f_al_end','text', editing?editing.endereco:''), true)}
    <div class="section-divider">Moradores</div>
    <div class="field span2">
      <div id="moradoresList" class="avatar-list">${renderMoradoresTags()}</div>
      <div class="add-inline">
        <input id="f_al_novoMorador" placeholder="chapa do colaborador" list="chapasList">
        <datalist id="chapasList">${STATE.efetivo.filter(empAtivo).map(e=>`<option value="${esc(e.chapa)}">${esc(e.nome)}</option>`).join('')}</datalist>
        <button class="btn btn-sm" onclick="addMoradorTmp()">Adicionar</button>
      </div>
    </div>
  </div>`;
  const foot = `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="submitAlojamento(${editing?`'${id}'`:'null'})">Salvar</button>`;
  openModal(editing?'Editar alojamento':'Novo alojamento', body, foot);
}
function renderMoradoresTags(){
  return (window.__tmpMoradores||[]).map(chapa=>{
    const e = getEmp(chapa);
    return `<span class="avatar-tag">${esc(e?e.nome:chapa)}<span class="rm" onclick="removeMoradorTmp('${esc(chapa)}')">✕</span></span>`;
  }).join('') || '<span class="text-faint" style="font-size:12px;">Nenhum morador ainda</span>';
}
function addMoradorTmp(){
  const chapa = val('f_al_novoMorador');
  if(!chapa) return;
  if(!window.__tmpMoradores.includes(chapa)) window.__tmpMoradores.push(chapa);
  document.getElementById('moradoresList').innerHTML = renderMoradoresTags();
  document.getElementById('f_al_novoMorador').value='';
}
function removeMoradorTmp(chapa){
  window.__tmpMoradores = window.__tmpMoradores.filter(c=>c!==chapa);
  document.getElementById('moradoresList').innerHTML = renderMoradoresTags();
}
function submitAlojamento(id){
  if(!requireEdit()) return;
  const nome = val('f_al_nome');
  if(!nome){ toast('Informe o nome do alojamento.','err'); return; }
  const existing = id ? STATE.alojamentos.find(a=>a.id===id) : null;
  const record = {id: id||uid(), nome, capacidade: Number(val('f_al_cap'))||0, endereco: val('f_al_end'), moradores: window.__tmpMoradores||[], itens: existing?existing.itens||[]:[]};
  if(id){ const idx = STATE.alojamentos.findIndex(a=>a.id===id); STATE.alojamentos[idx]=record; }
  else STATE.alojamentos.push(record);
  closeModal(); saveAlojamentos();
}
function deleteAlojamento(id){
  if(!requireEdit()) return;
  if(!confirm('Excluir este alojamento? Os itens de mobília cadastrados nele também serão excluídos.')) return;
  STATE.alojamentos = STATE.alojamentos.filter(a=>a.id!==id);
  saveAlojamentos();
}

function openItemForm(alojamentoId, itemId){
  if(STATE.alojamentos.length===0){ toast('Cadastre um alojamento primeiro.','err'); return; }
  let editingCasa = alojamentoId ? STATE.alojamentos.find(a=>a.id===alojamentoId) : null;
  let editingItem = editingCasa && itemId ? (editingCasa.itens||[]).find(i=>i.id===itemId) : null;
  const body = `<div class="form-grid">
    ${field('Alojamento *', sel('f_it_casa', STATE.alojamentos.map(a=>({value:a.id,label:a.nome})), editingCasa?editingCasa.id:''), true)}
    ${field('Item *', inp('f_it_nome','text', editingItem?editingItem.nome:'', 'ex: cama, geladeira, fogão'))}
    ${field('Quantidade', inp('f_it_qtd','number', editingItem?editingItem.quantidade:1))}
    <div class="field span2">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <input type="checkbox" id="f_it_patrimonio" ${editingItem&&editingItem.patrimonio?'checked':''} onchange="togglePatrimonioField()" style="width:auto;">
        Tem número de patrimônio
      </label>
    </div>
    <div class="field span2" id="f_it_numeroWrap" style="display:${editingItem&&editingItem.patrimonio?'flex':'none'};">
      <label>Número do patrimônio</label>
      <input id="f_it_numero" type="text" value="${esc(editingItem?editingItem.numeroPatrimonio:'')}" placeholder="ex: PAT-00123">
    </div>
  </div>`;
  const foot = `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="submitItem(${alojamentoId?`'${alojamentoId}'`:'null'}, ${itemId?`'${itemId}'`:'null'})">Salvar</button>`;
  openModal(editingItem?'Editar item':'Novo item de mobília', body, foot);
}
function togglePatrimonioField(){
  const on = document.getElementById('f_it_patrimonio').checked;
  document.getElementById('f_it_numeroWrap').style.display = on ? 'flex' : 'none';
}
function submitItem(oldCasaId, itemId){
  if(!requireEdit()) return;
  const casaId = val('f_it_casa'), nome = val('f_it_nome');
  if(!casaId){ toast('Selecione o alojamento.','err'); return; }
  if(!nome){ toast('Informe o nome do item.','err'); return; }
  const temPatrimonio = document.getElementById('f_it_patrimonio').checked;
  const item = {
    id: itemId || uid(), nome,
    quantidade: Number(val('f_it_qtd'))||1,
    patrimonio: temPatrimonio,
    numeroPatrimonio: temPatrimonio ? val('f_it_numero') : null
  };
  // remove from old casa if moved
  if(itemId && oldCasaId && oldCasaId !== casaId){
    const oldCasa = STATE.alojamentos.find(a=>a.id===oldCasaId);
    if(oldCasa) oldCasa.itens = (oldCasa.itens||[]).filter(i=>i.id!==itemId);
  }
  const casa = STATE.alojamentos.find(a=>a.id===casaId);
  if(!casa){ toast('Alojamento não encontrado.','err'); return; }
  casa.itens = casa.itens || [];
  const idx = casa.itens.findIndex(i=>i.id===item.id);
  if(idx>-1) casa.itens[idx] = item; else casa.itens.push(item);
  closeModal();
  saveAlojamentos();
}
function deleteItem(casaId, itemId){
  if(!requireEdit()) return;
  if(!confirm('Excluir este item?')) return;
  const casa = STATE.alojamentos.find(a=>a.id===casaId);
  if(casa) casa.itens = (casa.itens||[]).filter(i=>i.id!==itemId);
  saveAlojamentos();
}

/* ============================================================
   PÁGINA: BASE SALARIAL
   ============================================================ */
function renderSalarial(){
  const list = STATE.efetivo.filter(empAtivo).map(e=>{
    const s = STATE.salarial.find(x=>String(x.chapa)===String(e.chapa)) || {chapa:e.chapa, salarioBase:0, ajustes:[]};
    return {emp:e, sal:s};
  }).sort((a,b)=>(a.emp.nome||'').localeCompare(b.emp.nome||''));

  const trs = list.map(r=>{
    const atual = salarioAtual(r.sal);
    const last = (r.sal.ajustes||[])[r.sal.ajustes.length-1];
    return `<tr>
      <td class="mono">${esc(r.emp.chapa)}</td>
      <td><b>${esc(r.emp.nome)}</b></td>
      <td class="mono text-dim">${fmtMoney(r.sal.salarioBase)}</td>
      <td class="mono text-dim">${last? (Number(last.percentual)>0?'+':'')+last.percentual+'%' : '—'}</td>
      <td class="mono"><b>${fmtMoney(atual)}</b></td>
      <td>${canEdit() ? `<button class="btn btn-sm btn-ghost" onclick="openSalarialForm('${esc(r.emp.chapa)}')">Editar</button>` : '<span class="text-faint">—</span>'}</td>
    </tr>`;
  }).join('');

  document.getElementById('mainContent').innerHTML = `
    <div class="topbar">
      <div><div class="page-title">Base Salarial</div><div class="page-sub">Folha total (ativos): ${fmtMoney(list.reduce((s,r)=>s+salarioAtual(r.sal),0))}</div></div>
    </div>
    <div class="panel">${tableSkeleton(['Chapa','Nome','Salário base','Último ajuste','Salário atual',''], [trs])}</div>
  `;
}
function openSalarialForm(chapa){
  const s = STATE.salarial.find(x=>String(x.chapa)===String(chapa)) || {chapa, salarioBase:0, ajustes:[]};
  const body = `<div class="form-grid">
    ${field('Salário base (R$) *', inp('f_sal_base','number', s.salarioBase))}
    ${field('Novo ajuste (%)', inp('f_sal_pct','number', '', 'ex: 5 para +5%'))}
    ${field('Motivo do ajuste', inp('f_sal_motivo','text', '', 'ex: reajuste anual'), true)}
    <div class="section-divider">Histórico de ajustes</div>
    <div class="field span2">${(s.ajustes||[]).length? (s.ajustes||[]).map(a=>`<div class="subtle-card" style="margin-bottom:6px;font-size:12px;">${fmtDate(a.data)} · ${a.percentual>0?'+':''}${a.percentual}% · <span class="text-faint">${esc(a.motivo||'')}</span></div>`).join('') : '<span class="text-faint" style="font-size:12px;">Nenhum ajuste registrado</span>'}</div>
  </div>`;
  const foot = `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="submitSalarial('${esc(chapa)}')">Salvar</button>`;
  openModal('Editar salário — '+ (getEmp(chapa)||{}).nome, body, foot);
}
function submitSalarial(chapa){
  if(!requireEdit()) return;
  const base = Number(val('f_sal_base'))||0;
  const pct = val('f_sal_pct');
  let s = STATE.salarial.find(x=>String(x.chapa)===String(chapa));
  if(!s){ s = {chapa, salarioBase:base, ajustes:[]}; STATE.salarial.push(s); }
  s.salarioBase = base;
  if(pct !== ''){ s.ajustes = s.ajustes||[]; s.ajustes.push({data: toISO(TODAY), percentual: Number(pct), motivo: val('f_sal_motivo')}); }
  closeModal(); saveSalarial();
}

/* ============================================================
   PÁGINA: PARÂMETROS
   ============================================================ */
function renderParametros(){
  const p = STATE.params;
  if(!canEdit()){
    document.getElementById('mainContent').innerHTML = `
      <div class="topbar"><div><div class="page-title">Parâmetros</div><div class="page-sub">Regras que controlam os cálculos e alertas automáticos do app</div></div></div>
      <div class="panel">${emptyState('🔒','Desbloqueie a edição (cadeado no menu) pra ver e alterar os parâmetros.')}</div>
    `;
    return;
  }
  document.getElementById('mainContent').innerHTML = `
    <div class="topbar"><div><div class="page-title">Parâmetros</div><div class="page-sub">Essas regras controlam todos os cálculos e alertas automáticos do app</div></div></div>
    <div class="panel">
      <div class="panel-title" style="margin-bottom:14px;">⟲ Regras de folga de campo</div>
      <div class="form-grid">
        ${field('Ciclo Tipo A — dias em obra', inp('p_cicloA','number', p.cicloA))}
        ${field('Dias de folga — Tipo A', inp('p_folgaA','number', p.folgaA))}
        ${field('Ciclo Tipo B — dias em obra', inp('p_cicloB','number', p.cicloB))}
        ${field('Dias de folga — Tipo B', inp('p_folgaB','number', p.folgaB))}
        ${field('🔴 Vermelho — urgente (dias antes da saída)', inp('p_folgaVermelho','number', p.alertaFolgaVermelho))}
        ${field('🟡 Amarelo — alerta antecipado (dias antes da saída)', inp('p_folgaAmarelo','number', p.alertaFolgaAmarelo))}
      </div>
    </div>
    <div class="panel">
      <div class="panel-title" style="margin-bottom:14px;">✈ Regras de passagens</div>
      <div class="form-grid">
        ${field('Alerta crítico — vermelho (dias)', inp('p_critico','number', p.alertaCritico))}
        ${field('Alerta amarelo — solicitar (dias)', inp('p_amarelo','number', p.alertaAmarelo))}
      </div>
    </div>
    <div class="panel">
      <div class="panel-title" style="margin-bottom:14px;">☀ Regras de férias</div>
      <div class="form-grid">
        ${field('Alerta urgente (dias antes do limite)', inp('p_feriasUrgente','number', p.alertaFeriasUrgente))}
        ${field('Alerta vencendo (dias antes do limite)', inp('p_feriasVencendo','number', p.alertaFeriasVencendo))}
      </div>
    </div>
    <div class="panel">
      <div class="panel-title" style="margin-bottom:14px;">🏷 Identidade do app</div>
      <div class="form-grid">
        ${field('Nome do app (aparece no banner do Dashboard)', inp('p_appName','text', p.appName), true)}
      </div>
    </div>
    <div class="panel">
      <div class="panel-title" style="margin-bottom:14px;">🔒 Senha de edição</div>
      <div class="form-grid">
        ${field('Nova senha', inp('p_novaSenha','text', '', 'deixe em branco pra manter a atual'))}
      </div>
    </div>
    <button class="btn btn-primary" onclick="submitParametros()">Salvar parâmetros</button>
  `;
}
function submitParametros(){
  if(!requireEdit()) return;
  const novaSenha = val('p_novaSenha');
  STATE.params = {
    cicloA:Number(val('p_cicloA'))||60, folgaA:Number(val('p_folgaA'))||7,
    cicloB:Number(val('p_cicloB'))||90, folgaB:Number(val('p_folgaB'))||10,
    alertaFolgaVermelho:Number(val('p_folgaVermelho'))||5, alertaFolgaAmarelo:Number(val('p_folgaAmarelo'))||15,
    alertaCritico:Number(val('p_critico'))||10, alertaAmarelo:Number(val('p_amarelo'))||25,
    alertaFeriasUrgente:Number(val('p_feriasUrgente'))||30, alertaFeriasVencendo:Number(val('p_feriasVencendo'))||60,
    editPassword: novaSenha ? novaSenha : STATE.params.editPassword,
    appName: val('p_appName') || 'ADM DE OBRAS ENERWATT'
  };
  saveParametros();
  if(novaSenha) toast('Senha de edição atualizada.');
}

/* ============================================================
   NAVEGAÇÃO / ROTEAMENTO
   ============================================================ */
const PAGE_RENDER = {
  dashboard: renderDashboard, efetivo: renderEfetivo, folga: renderFolga,
  passagens: renderPassagens, ferias: renderFerias, ajudacusto: renderAjudaCusto,
  alojamentos: renderAlojamentos, salarial: renderSalarial, parametros: renderParametros
};

function badgeFor(id){
  const ativos = STATE.efetivo.filter(empAtivo);
  if(id==='efetivo') return STATE.efetivo.length || '';
  if(id==='folga'){
    const n = ativos.filter(e=>{const st=computeFolgaStatus(getActiveCycle(e)); return st==='FOLGA_ATRASADA'||st==='RETORNO_ATRASADO'||st==='FOLGA_URGENTE';}).length;
    return n || '';
  }
  if(id==='passagens'){
    const n = ativos.filter(e=>computePassagemStatus(getActiveCycle(e), getPassagemInfo(e.chapa)).level==='red').length;
    return n || '';
  }
  if(id==='ferias'){
    const n = ativos.filter(e=>{const st=computeFeriasStatus(getActivePeriodo(e)); return st==='URGENTE'||st==='VENCIDA';}).length;
    return n || '';
  }
  if(id==='ajudacusto'){ const n = STATE.ajudacusto.filter(a=>a.status==='PENDENTE').length; return n || ''; }
  if(id==='alojamentos') return STATE.alojamentos.length || '';
  return '';
}

function renderNav(){
  document.getElementById('navList').innerHTML = NAV_ITEMS.map(item=>{
    const b = badgeFor(item.id);
    return `<div class="nav-item ${ROUTE===item.id?'active':''}" onclick="navigate('${item.id}')">
      <span class="nav-icon">${item.icon}</span><span>${item.label}</span>
      ${b!==''? `<span class="nav-badge">${b}</span>` : ''}
    </div>`;
  }).join('');
}

function navigate(route){
  ROUTE = route;
  render();
  closeSidebar();
}

function toggleSidebar(){
  document.getElementById('sidebarEl').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebarEl').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
}

function render(){
  renderNav();
  renderSidebarFoot();
  const bt = document.getElementById('brandTitle');
  if(bt) bt.textContent = STATE.params.appName || 'ADM DE OBRAS ENERWATT';
  const mt = document.getElementById('mobileTopbarTitle');
  if(mt) mt.textContent = STATE.params.appName || 'ADM DE OBRAS ENERWATT';
  (PAGE_RENDER[ROUTE] || renderDashboard)();
}
function renderSidebarFoot(){
  const el = document.getElementById('sidebarFoot');
  if(!el) return;
  if(STATE.editUnlocked){
    el.innerHTML = `<div class="lock-row" onclick="lockEdit()"><span>🔓</span><span>Edição liberada — toque pra travar</span></div>`;
  } else {
    el.innerHTML = `<div class="lock-row" onclick="promptUnlock()"><span>🔒</span><span>Modo visualização — toque pra editar</span></div>`;
  }
}

/* ---------- INIT ---------- */
async function init(){
  await loadAll();
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  render();
}
init();
</script>
</body>
</html>
